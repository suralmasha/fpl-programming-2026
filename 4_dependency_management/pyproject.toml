# Пример pyproject.toml. В проекте файл должен лежать в корне
# Описание секций: pyproject_usage.md.
# uv sync --group test - установить зависимости приложения, dev и test
# uv add <package> - добавить зависимость приложения
# uv add --dev <package> - добавить инструмент разработки
# uv run <command> - запустить команду в окружении проекта
# uv lock --upgrade - обновить версии зависимостей в uv.lock

[build-system]  # настройки сборки проекта в устанавливаемый пакет
requires = ['uv_build==0.11.33']  # зависимость для сборки и допустимые версии
build-backend = 'uv_build'  # модуль, который собирает wheel и исходный архив

[tool.uv]
package = false  # устанавливать только зависимости, без сборки самого проекта

[project]  # метаданные пакета и требования для его работы
name = 'project-name'  # имя проекта
version = '1.0.0'  # версия публикуемого пакета
description = 'Короткое описание проекта'  # краткое описание пакета
authors = [  # авторы проекта и их контактные данные
    { name = 'Name Surname', email = 'email@example.com' },
]
readme = 'README.md'  # файл с полным описанием пакета
requires-python = '>=3.11'  # поддерживаемые версии Python
dependencies = [  # зависимости, необходимые при использовании пакета
    'pydantic==2.14.2',
    'requests==2.34.2',
    'fastapi==0.162.0',
]

[dependency-groups]  # группы зависимостей для разработки, не входят в зависимости пакета
test = ['pytest==9.2.0']  # инструменты тестирования
dev = [  # инструменты разработки  (uv устанавливает группу dev по умолчанию)
    'mypy==2.4.1',  # статическая проверка типов
    'ruff==0.17.3',  # линтер
    'pre-commit==4.7.0',  # запуск проверок перед коммитом
    'black==26.10.1',  # форматирование кода
    'isort==9.0.2',  # сортировка импортов
]

[tool.pytest.ini_options]  # настройки запуска тестов через pytest
testpaths = ['tests']  # где искать тесты при запуске без указания пути

[tool.mypy]  # настройки статической проверки типов
strict = true  # включить набор строгих проверок mypy

[tool.ruff]  # общие настройки Ruff
line-length = 120  # целевая длина строки для правил и форматтера Ruff
target-version = 'py311'  # минимальная версия Python, соответствующая requires-python
extend-exclude = ['**/tests/**']  # не проверять тесты, сохранив стандартные исключения Ruff
force-exclude = true  # применять исключения и к файлам, явно переданным pre-commit

[tool.ruff.format]  # настройки форматтера Ruff, альтернатива Black
quote-style = 'single'  # приводить строки к одинарным кавычкам, когда это возможно

[tool.ruff.lint]  # правила линтера Ruff
# Все правила: https://docs.astral.sh/ruff/rules/
select = [
    'E',  # ошибки стиля кода по PEP 8
    'F',  # ошибки кода, например неиспользуемые импорты
    'W',  # предупреждения о стиле кода
    'C90',  # избыточная сложность функций
    'B',  # потенциальные ошибки и опасные конструкции
    'I',  # порядок импортов
    'D',  # оформление docstring
    'RUF',  # собственные правила Ruff
]
ignore = [
    'D100',  # не требовать docstring для каждого публичного модуля
    'E501',  # переносами строк управляет форматтер
    'RUF001', 'RUF002', 'RUF003',  # разрешить похожие на латиницу символы кириллицы в строках, docstring и комментариях
]

[tool.ruff.lint.pydocstyle]  # соглашение для проверки docstring
convention = 'pep257'  # использовать правила PEP 257

[tool.black]  # настройки форматтера Black
line-length = 120  # целевая длина строки, не жесткое ограничение

[tool.isort]  # настройки сортировки импортов
profile = 'black'  # форматировать импорты совместимо с Black
line_length = 120  # согласовать переносы импортов с длиной строки Black
